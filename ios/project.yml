# XcodeGen-Beschreibung des Xcode-Projekts
# Damit muss keine .xcodeproj-Datei ins Repo, der GitHub-Actions-Runner baut sie sich selbst
# Lokal (falls doch mal ein Mac da ist): xcodegen generate

name: Steward
options:
  bundleIdPrefix: at.lorenz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # bewusst KEINE Push-Notifications-Capability, sonst scheitert die Signierung
    # mit der kostenlosen Apple-ID
    CODE_SIGN_STYLE: Automatic

targets:
  Steward:
    type: application
    platform: iOS
    sources:
      - path: Steward
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Steward
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Für die Spracheingabe von Fragen und Aufgaben an Steward
        NSSpeechRecognitionUsageDescription: Damit Diktiertes in Text umgewandelt werden kann
        # Hintergrund-Blick nach neuen Berichten (ersetzt Push-Nachrichten)
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - at.lorenz.steward.aktualisieren
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.lorenz.steward
        TARGETED_DEVICE_FAMILY: "1"
