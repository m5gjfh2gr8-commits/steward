# XcodeGen-Beschreibung des Xcode-Projekts
# Damit muss keine .xcodeproj-Datei ins Repo, der GitHub-Actions-Runner baut sie sich selbst
# Lokal (falls doch mal ein Mac da ist): xcodegen generate

name: Steward
options:
  bundleIdPrefix: at.lorenz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # bewusst KEINE Push-Notifications-Capability, sonst scheitert die Signierung
    # mit der kostenlosen Apple-ID
    CODE_SIGN_STYLE: Automatic

targets:
  Steward:
    type: application
    platform: iOS
    sources:
      - path: Steward
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Steward
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Fuer die Spracheingabe von Terminen und Essenseintraegen
        NSSpeechRecognitionUsageDescription: Damit Diktiertes in Text umgewandelt werden kann
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.lorenz.steward
        TARGETED_DEVICE_FAMILY: "1"
